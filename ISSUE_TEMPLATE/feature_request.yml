name: Feature request
description: Explain a use case, the desired outcome and possible alternatives.
title: ''
body:
  - type: markdown
    attributes:
      value: |-
        A proposal starts a design conversation, not a delivery promise. Check existing issues and repository-specific guidance first.
        Keep this public request free of secrets, private keys, traffic keylogs and real private captures. Vulnerability details belong only in a verified private reporting route, never a public issue.
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Who needs this, and what are they trying to accomplish? Describe the current limitation without private data.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would a useful solution let you do? A concrete example is welcome; an implementation design is not required.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs (optional)
      description: Workarounds or other approaches considered. Note compatibility, complexity or privacy trade-offs if relevant.
  - type: textarea
    id: context
    attributes:
      label: Related context (optional)
      description: Relevant docs, draft sections, issues or a small synthetic example.
