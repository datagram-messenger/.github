name: Bug report
description: Report a non-sensitive defect with a small, reproducible example.
title: ''
body:
  - type: markdown
    attributes:
      value: |-
        Thanks for helping improve Datagram. Follow this repository's own contribution instructions first.
        **Suspected vulnerability? Do not submit it here.** Follow the repository's SECURITY.md, or use Security → Advisories → Report a vulnerability only if private reporting is enabled. If no verified private route exists, keep details private and ask a maintainer privately for a route.
        Never include secrets, private keys, tokens, traffic keylogs, decrypted private messages or real private packet captures. Use synthetic test data only.
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
      description: Describe the defect and its effect on your workflow.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps, a small test or a synthetic example. Explain if you cannot reproduce reliably.
      placeholder: |-
        1. Set up a test-only client and server…
        2. Send…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Revision and environment
      description: Repository commit or package version; relevant OS, runtime and tool versions. Mention which component is involved.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context (optional)
      description: Related issues, a failing test or a short sanitized log using synthetic data only. Do not attach real private captures or any keylogs.
