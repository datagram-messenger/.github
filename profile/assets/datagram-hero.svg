    <text x="56" y="64" fill="#a3a3a3" font-size="14" font-weight="500" letter-spacing="3">OPEN SOURCE. OPEN CONVERSATIONS.</text>
    <text x="52" y="163" fill="#fafafa" font-size="76" font-weight="650" letter-spacing="-3">Datagram</text>
    <text x="56" y="208" fill="#b5b5b5" font-size="32" font-weight="400" letter-spacing="0.5">Messenger</text>
    <text x="56" y="286" fill="#a3a3a3" font-size="20" font-weight="400">Engineering the conversation.</text>
  </g>
