<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Datagram Messenger — engineering the conversation</title>
  <desc id="hero-desc">Minimal monochrome banner on a GitHub-dark background. A white Datagram wordmark and quiet grey typography accompany an original rounded message symbol with three packet-shaped marks.</desc>
